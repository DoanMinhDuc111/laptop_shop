<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tất cả sản phẩm - MyStore</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">MyStore</div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Bạn cần tìm máy gì hôm nay?" oninput="filterProducts()">
        </div>
        <div class="nav-links">
            <a href="register.html" class="btn-register">Đăng ký</a>
            <a href="login.html" id="login-btn" class="btn-login">Đăng nhập</a>
            <div id="user-info" style="display:none; color:white;">
                <span id="user-display"></span>
                <button onclick="logout()" style="background:none; border:1px solid white; margin-left:10px;">Đăng xuất</button>
            </div>
            <button onclick="openCart()" class="cart-btn">🛒 <span id="cart-count">0</span></button>
        </div>
    </header>

    <main>
        <h1 style="padding-left: 8%; margin-top: 40px;">Tất cả sản phẩm</h1>
        <div id="product-grid"></div>
    </main>

    <div id="product-modal" class="modal">
        <div class="modal-content">
            <span onclick="closeModal()" style="float:right; cursor:pointer; font-size: 24px;">&times;</span>
            <div id="modal-body"></div>
            <button onclick="askAIAboutProduct()" style="margin-top:15px; width:100%;">Hỏi AI về máy này</button>
        </div>
    </div>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span onclick="closeCart()" style="float:right; cursor:pointer; font-size: 24px;">&times;</span>
            <h2>Giỏ hàng của bạn</h2>
            <div id="cart-items" style="margin: 20px 0;"></div>
            <div id="checkout-form" style="display:none; margin-bottom: 15px;">
                <input type="text" id="customer-name" placeholder="Họ và tên" style="width:90%; padding:10px; margin-bottom:5px;">
                <input type="text" id="customer-address" placeholder="Địa chỉ giao hàng" style="width:90%; padding:10px;">
            </div>
            <button id="checkout-btn" onclick="checkout()" style="width:100%;">Thanh toán</button>
            <button onclick="openHistory()" style="width:100%; margin-top:10px; background:#6366f1;">Xem lịch sử</button>
        </div>
    </div>

    <div class="ai-icon" onclick="openAIChat()">🤖</div>
    <div id="chat-box">
        <h3>Trợ lý AI</h3>
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Hỏi gì về laptop...">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script src="script.js"></script>
    <script src="ai.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof loadProducts === 'function') {
                loadProducts();
            }
        });
    </script>
</body>
</html>
