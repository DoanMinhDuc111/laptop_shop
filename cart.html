<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng - TTGShop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            background: #f3f4f6; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: #46748c;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar .logo { color: white; font-size: 24px; font-weight: bold; }
        
        .cart-wrapper {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .cart-wrapper { grid-template-columns: 1fr; }
        }
        
        .cart-box, .checkout-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .cart-box h2, .checkout-box h3 { margin-top: 0; color: #1f2937; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Poppins', sans-serif;}
        button.btn-checkout { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px;}
        button.btn-checkout:hover { background: #059669; }
        
        /* FOOTER ĐỒNG BỘ */
        footer.main-footer {
            background-color: #46748c;
            color: #f1f5f9;
            padding: 40px 6px 20px 6px;
            font-size: 13px;
            margin-top: auto;
            border-top: 4px solid #365c71;
        }
        .footer-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 30px; max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        .footer-col h3 { color: #ffffff; font-size: 14px; font-weight: 600; margin-bottom: 15px; }
        .footer-col ul { list-style: none; padding: 0; }
        .footer-col ul li { margin-bottom: 8px; color: #e2e8f0; }
        .badge-icon { display: inline-block; background: rgba(255, 255, 255, 0.15); padding: 4px 10px; margin: 4px 4px 4px 0; border-radius: 4px; font-size: 11px; color: #fff; }
        .footer-bottom { text-align: center; margin-top: 40px; padding-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); font-size: 12px; color: #cbd5e1; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">TTGShop</div>
        <div class="nav-links">
            <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">🏠 Trang chủ</a>
        </div>
    </header>

    <main class="cart-wrapper">
        <div class="cart-box">
            <h2>🛒 Giỏ hàng của bạn</h2>
            <div id="cart-page-items"></div>
            <div id="cart-total" style="text-align: right; margin-top: 20px; font-weight: bold; font-size: 16px; color: #1f2937;"></div>
        </div>

        <div class="checkout-box" id="checkout-form-section">
            <h3>📋 Thông tin giao hàng</h3>
            <input type="text" id="customer-name" placeholder="Họ và tên người nhận">
            <input type="tel" id="customer-phone" placeholder="Số điện thoại nhận hàng">
            <input type="text" id="customer-address" placeholder="Địa chỉ giao hàng chi tiết">
            <button class="btn-checkout" onclick="window.checkout()">Xác nhận đặt hàng</button>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-col">
                <h3>TỔNG ĐÀI HỖ TRỢ</h3>
                <p>Gọi mua: <strong>1800.3892</strong> (24/7)</p>
                <h4>PHƯƠNG THỨC THANH TOÁN</h4>
                <div><span class="badge-icon">VNPay</span><span class="badge-icon">MoMo</span></div>
            </div>
            <div class="footer-col">
                <h3>THÔNG TIN VÀ CHÍNH SÁCH</h3>
                <ul><li>Chính sách bảo hành</li></ul>
            </div>
        </div>
        <div class="footer-bottom"><p>© 2026 Công ty Cổ phần Thương mại Điện tử TTGShop.</p></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
